[project]
name = "agent-sandbox"
version = "1.0.0"
description = "Create and manage per-workspace sandboxes for AI agent harnesses"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
agent-sandbox = "agent_sandbox.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff", "ty"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a working rootless/rootful container engine and network (run with --integration)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ty.environment]
python-version = "3.12"
